table: silver.orders
purpose: >
  Registrar cada orden con sus fechas tipadas y su estado de entrega, como
  base temporal para ventas diarias y para el cálculo de Recency en RFM.
grain: "Una fila por order_id."
primary_key: [order_id]
owner: "equipo-pudulake"
lineage: [bronze.orders]
classification: "internal"
required_columns:
  - order_id
  - customer_id
  - order_status
  - order_purchase_timestamp
  - order_approved_at
  - order_delivered_carrier_date
  - order_delivered_customer_date
  - order_estimated_delivery_date
  - delivery_timestamp_missing
column_types:
  order_id: string
  customer_id: string
  order_status: string
  order_purchase_timestamp: datetime
allow_empty: false
constraints:
  order_id:
    nullable: false
    unique: true
  customer_id:
    nullable: false
  order_purchase_timestamp:
    nullable: false
