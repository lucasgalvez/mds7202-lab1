table: gold.sales_daily
purpose: Resumir el valor de los ítems vendidos y las órdenes entregadas por fecha de compra.
grain: Una fila por fecha de venta.
primary_key:
  - sale_date
owner: Equipo de Datos Pudubella
lineage:
  - silver.orders
  - silver.order_items
classification: interno

required_columns:
  - sale_date
  - items_sold_value
  - delivered_orders

column_types:
  sale_date: date
  items_sold_value: float
  delivered_orders: integer

allow_empty: false

constraints:
  sale_date:
    nullable: false
    unique: true
  items_sold_value:
    nullable: false
    minimum: 0
    finite: true
  delivered_orders:
    nullable: false
    minimum: 0
