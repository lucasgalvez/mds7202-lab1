table: silver.order_items
purpose: >
  Registrar cada ítem vendido con precio y flete verificados como no
  negativos, insumo directo de ventas diarias.
grain: "Una fila por order_id y order_item_id."
primary_key: [order_id, order_item_id]
owner: "equipo-pudulake"
lineage: [bronze.order_items]
classification: "internal"
required_columns:
  - order_id
  - order_item_id
  - price
  - freight_value
column_types:
  order_id: string
  order_item_id: integer
  price: float
  freight_value: float
allow_empty: false
constraints:
  price:
    nullable: false
    minimum: 0
    finite: true
  freight_value:
    nullable: false
    minimum: 0
    finite: true
